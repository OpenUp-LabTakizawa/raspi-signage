[tools]
bun = "latest"
rumdl = "latest"
pitchfork = "latest"

[env]
DATABASE_URL = "postgres://raspi:raspi@127.0.0.1:54322/raspi_signage"
BETTER_AUTH_SECRET = "raspi-signage-development-secret-change-me"
BETTER_AUTH_URL = "http://localhost:{{ env.WEB_PORT }}"
NEXT_PUBLIC_APP_URL = "http://localhost:{{ env.WEB_PORT }}"
STORAGE_PROVIDER = "s3"
S3_ENDPOINT = "http://127.0.0.1:9000"
S3_REGION = "us-east-1"
S3_ACCESS_KEY_ID = "rustfsadmin"
S3_SECRET_ACCESS_KEY = "rustfsadmin"
S3_BUCKET = "signage-contents"
S3_PUBLIC_BASE_URL = "http://127.0.0.1:9000/signage-contents"

[tasks.fix]
run = ["bun fix --unsafe", "mise fix:md"]

[tasks."fix:md"]
description = "Check and fix markdown files with rumdl"
run = "rumdl check --fix ."

[tasks."fmt:md"]
description = "Format markdown files with rumdl"
run = "rumdl fmt ."

[tasks."local:up"]
description = "Start local Postgres + RustFS via docker compose"
run = "mise daemons start db"

[tasks."local:down"]
description = "Stop local Postgres + RustFS containers"
run = "mise daemons stop"

[tasks."local:provision"]
description = "Apply the schema and create the bucket"
run = ["mise db:migrate", "mise db:ensure-bucket"]

[tasks."db:reset"]
description = "Re-apply schema, ensure bucket, and re-seed (truncates app tables)"
daemons = ["db"]
run = ["mise db:migrate", "mise db:ensure-bucket", "mise db:seed"]

[tasks."test:e2e"]
description = "Run the Playwright suite against the web daemon"
daemons = ["web"]
run = "bun test:e2e"

[tasks.update]
description = "Update bun dependencies and reinstall"
run = ["bun update", "mise deps"]

[daemons.db]
run = "docker compose up"
ready_cmd = { run = "mise run local:provision", timeout = "300s" }
stop_signal = { signal = "SIGTERM", timeout = "30s" }

[daemons.web]
run = "bun dev"
depends = ["db"]
port = 3000
ready_port = { port = 3000, timeout = "60s" }

[deps.bun]
auto = true

[hooks]
enter = ["mise deps -q"]

[settings]
experimental = true
